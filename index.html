<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="name">Campaign Launch</h1>
    <p class="intro">Time left until launch</p>

    <section class="timer">
      <div class="unit"><span id="days">0</span><small>days</small></div>
      <div class="unit"><span id="hours">0</span><small>hours</small></div>
      <div class="unit"><span id="minutes">0</span><small>minutes</small></div>
      <div class="unit"><span id="seconds">0</span><small>seconds</small></div>
    </section>

    <p id="done" hidden>We're live! 🚀</p>

    <form id="settings">
      <label for="campaign">Campaign name</label>
      <input id="campaign" type="text" placeholder="Diwali Sale">
      <label for="date">Launch date and time</label>
      <input id="date" type="datetime-local">
      <button type="submit">Start countdown</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
